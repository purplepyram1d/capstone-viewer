<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Capstone Viewer: the Eye of Providence">
  <!-- Capstone Viewer logo (Johnny chose the classic form, 2026-10-28): an eye framed by a triangle inside a full glory of fine rays. One color, so pages tint it with the theme accent through a CSS mask; the default color is used where it is shown as an image. Small sizes use eye-of-providence-small.svg (no rays). -->
  <defs>
    <mask id="glory" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <polygon points="50,12.5 87,74.5 13,74.5" fill="#000"/>
    </mask>
    <mask id="frame" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <polygon points="50,27.4 72.2,65.7 27.8,65.7" fill="#000"/>
    </mask>
    <clipPath id="almond"><path d="M35.5 54 Q50 41 64.5 54 Q50 66 35.5 54 Z"/></clipPath>
    <mask id="iris" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="50" cy="54" r="3.9" fill="#000"/>
      <circle cx="50" cy="54" r="2.3" fill="#fff"/>
      <circle cx="51.7" cy="52.4" r="0.85" fill="#000"/>
    </mask>
  </defs>
  <g fill="currentColor" stroke="currentColor" style="color:#9b7fd4">
    <!-- Glory: 48 rays, long and short alternating, stopping short of the triangle. -->
    <g mask="url(#glory)" stroke="none">
      <path id="r1" d="M50 54 L50.9 4 L49.1 4 Z"/>
      <path id="r2" d="M50 54 L50.6 13.5 L49.4 13.5 Z" transform="rotate(7.5 50 54)"/>
      <use href="#r1" transform="rotate(15 50 54)"/><use href="#r2" transform="rotate(15 50 54)"/>
      <use href="#r1" transform="rotate(30 50 54)"/><use href="#r2" transform="rotate(30 50 54)"/>
      <use href="#r1" transform="rotate(45 50 54)"/><use href="#r2" transform="rotate(45 50 54)"/>
      <use href="#r1" transform="rotate(60 50 54)"/><use href="#r2" transform="rotate(60 50 54)"/>
      <use href="#r1" transform="rotate(75 50 54)"/><use href="#r2" transform="rotate(75 50 54)"/>
      <use href="#r1" transform="rotate(90 50 54)"/><use href="#r2" transform="rotate(90 50 54)"/>
      <use href="#r1" transform="rotate(105 50 54)"/><use href="#r2" transform="rotate(105 50 54)"/>
      <use href="#r1" transform="rotate(120 50 54)"/><use href="#r2" transform="rotate(120 50 54)"/>
      <use href="#r1" transform="rotate(135 50 54)"/><use href="#r2" transform="rotate(135 50 54)"/>
      <use href="#r1" transform="rotate(150 50 54)"/><use href="#r2" transform="rotate(150 50 54)"/>
      <use href="#r1" transform="rotate(165 50 54)"/><use href="#r2" transform="rotate(165 50 54)"/>
      <use href="#r1" transform="rotate(180 50 54)"/><use href="#r2" transform="rotate(180 50 54)"/>
      <use href="#r1" transform="rotate(195 50 54)"/><use href="#r2" transform="rotate(195 50 54)"/>
      <use href="#r1" transform="rotate(210 50 54)"/><use href="#r2" transform="rotate(210 50 54)"/>
      <use href="#r1" transform="rotate(225 50 54)"/><use href="#r2" transform="rotate(225 50 54)"/>
      <use href="#r1" transform="rotate(240 50 54)"/><use href="#r2" transform="rotate(240 50 54)"/>
      <use href="#r1" transform="rotate(255 50 54)"/><use href="#r2" transform="rotate(255 50 54)"/>
      <use href="#r1" transform="rotate(270 50 54)"/><use href="#r2" transform="rotate(270 50 54)"/>
      <use href="#r1" transform="rotate(285 50 54)"/><use href="#r2" transform="rotate(285 50 54)"/>
      <use href="#r1" transform="rotate(300 50 54)"/><use href="#r2" transform="rotate(300 50 54)"/>
      <use href="#r1" transform="rotate(315 50 54)"/><use href="#r2" transform="rotate(315 50 54)"/>
      <use href="#r1" transform="rotate(330 50 54)"/><use href="#r2" transform="rotate(330 50 54)"/>
      <use href="#r1" transform="rotate(345 50 54)"/><use href="#r2" transform="rotate(345 50 54)"/>
    </g>
    <!-- The triangle frame. -->
    <polygon points="50,19.5 79,69.7 21,69.7" mask="url(#frame)" stroke="none"/>
    <!-- The eye: upper and lower lids, lashes, iris ring, pupil, catch-light. -->
    <path d="M35.5 54 Q50 41 64.5 54" fill="none" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M35.5 54 Q50 66 64.5 54" fill="none" stroke-width="1.3" stroke-linecap="round"/>
    <g fill="none" stroke-width="1.1" stroke-linecap="round">
      <path d="M41.5 49.2 L40.2 46.4"/><path d="M45.6 47.3 L45 44.3"/><path d="M50 46.6 L50 43.5"/><path d="M54.4 47.3 L55 44.3"/><path d="M58.5 49.2 L59.8 46.4"/>
    </g>
    <g clip-path="url(#almond)" stroke="none"><circle cx="50" cy="54" r="5.8" mask="url(#iris)"/></g>
  </g>
</svg>
