<svg xmlns="http://www.w3.org/2000/svg" viewBox="19 15 62 62" role="img" aria-label="Capstone Viewer">
  <!-- Small-size Capstone mark (favicon, tray, window icon): the eye in its triangle without the glory or
       lashes, with heavier lines so it stays legible at 16 to 32 pixels. -->
  <defs>
    <mask id="frame" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <polygon points="50,30.6 69.6,64.5 30.4,64.5" fill="#000"/>
    </mask>
    <clipPath id="almond"><path d="M39 52.5 Q50 43.5 61 52.5 Q50 61.5 39 52.5 Z"/></clipPath>
    <mask id="iris" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="50" cy="52.5" r="1.9" fill="#000"/>
    </mask>
  </defs>
  <g fill="currentColor" stroke="currentColor" style="color:#9b7fd4">
    <polygon points="50,17.5 80.5,70.3 19.5,70.3" mask="url(#frame)" stroke="none"/>
    <path d="M39 52.5 Q50 43.5 61 52.5 Q50 61.5 39 52.5 Z" fill="none" stroke-width="2.2" stroke-linejoin="round"/>
    <g clip-path="url(#almond)" stroke="none"><circle cx="50" cy="52.5" r="4.5" mask="url(#iris)"/></g>
  </g>
</svg>
