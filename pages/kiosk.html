<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/assets/theme.js"></script><link rel="icon" type="image/svg+xml" href="/assets/eye-of-providence-small.svg"><title>Kiosk · Capstone Viewer</title>
<link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/vendor/maplibre-gl.css"><link rel="stylesheet" href="/assets/console.css">
<script defer src="/assets/vendor/maplibre-gl.js"></script><script defer src="/assets/common.js"></script><script defer src="/assets/map-labels.js"></script><script defer src="/assets/kiosk.js"></script><link rel="stylesheet" href="/assets/themes.css"></head>
<body class="console kiosk" data-live="full">
<div class="kiosk-shell">
  <header class="kiosk-top"><div class="kiosk-brand"><span class="brand-icon" aria-hidden="true">◭</span><span>CAPSTONE <b>VIEWER</b></span></div><div id="kiosk-tiles" class="kiosk-tiles" aria-label="Status board"></div><div class="kiosk-clocks"><span id="zulu" class="mono"></span><span id="kiosk-local" class="mono"></span></div></header>
  <div id="kiosk-banner" class="kiosk-banner" role="alert" hidden></div>
  <main class="kiosk-stage">
    <div id="kiosk-map" aria-label="Rotating world map of hot spots and stories"></div><div id="kiosk-fallback" hidden></div>
    <aside id="kiosk-focus" class="kiosk-focus" aria-live="polite"><p class="eyebrow">WAITING FOR THE FIRST SNAPSHOT</p></aside>
    <div id="kiosk-progress" class="kiosk-progress" aria-hidden="true"><i></i></div>
  </main>
  <footer class="kiosk-ticker" aria-label="Latest headlines"><span class="kiosk-ticker-label">LATEST</span><div class="kiosk-ticker-window"><div id="kiosk-ticker-track" class="kiosk-ticker-track"></div></div></footer>
</div>
<div id="kiosk-controls" class="kiosk-controls" hidden>
  <button id="kiosk-prev" aria-label="Previous focus">◀</button><button id="kiosk-pause">Pause tour</button><button id="kiosk-next" aria-label="Next focus">▶</button>
  <button id="kiosk-sound">Sound off</button><button id="kiosk-settings-open">Settings</button><button id="fullscreen">⛶ <span>Fullscreen</span></button><a href="/ops">Operations</a>
  <span class="kiosk-keys">Space pause · ← → step · M sound · F fullscreen · S settings</span>
</div>
<dialog id="kiosk-settings"><form id="kiosk-settings-form"><div class="dialog-heading"><h2>Kiosk settings</h2><button type="button" id="kiosk-settings-close" aria-label="Close settings">✕</button></div>
  <p>Saved on this device for the kiosk window only.</p>
  <div class="feed-form-row"><label>Seconds per focus<input type="number" id="ks-dwell" min="8" max="180" required></label><label>Map<select id="ks-projection"><option value="globe">Globe</option><option value="mercator">Flat</option></select></label></div>
  <label class="feed-check"><input type="checkbox" id="ks-sound">Alert tones</label>
  <label class="feed-check"><input type="checkbox" id="ks-amber">Also chime when a tile turns Elevated (Severe always alarms)</label>
  <label>Volume<input type="range" id="ks-volume" min="0" max="1" step="0.05"></label>
  <div class="feed-form-row"><label>Quiet hours start<input type="time" id="ks-quiet-start"></label><label>Quiet hours end<input type="time" id="ks-quiet-end"></label></div>
  <p class="subtle">During quiet hours the banner still shows; tones stay silent. Leave both blank for no quiet hours.</p>
  <div class="dialog-actions"><button type="button" id="ks-test">Test Severe tone</button><button type="submit" class="primary">Save</button></div>
</form></dialog>
</body></html>
